# Запуск: cp .env.docker.example .env.docker && docker compose --env-file .env.docker up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: id_gallery
      POSTGRES_USER: id_gallery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U id_gallery -d id_gallery']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        VITE_DEMO_DATA: ${VITE_DEMO_DATA:-true}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://id_gallery:${POSTGRES_PASSWORD}@db:5432/id_gallery
      ADMIN_LOGIN: ${ADMIN_LOGIN:?задайте ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - '${APP_PORT:-8080}:3001'
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
